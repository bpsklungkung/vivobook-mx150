---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: vivobook-mx150
# description will be included in the image's metadata
description: This is my personal OS image.

base-image: ghcr.io/blue-build/base-images/fedora-silverblue-nvidia
image-version: latest   # or pin e.g. 43

modules:
  # Tailscale isn't in Fedora's repos, so add its repo and install it
  - type: dnf
    install:
      packages:
        - tailscale
        - chromium
        - fish
        - gh
        - freerdp        # provides /usr/bin/xfreerdp

  - type: systemd
    system:
      enabled:
        - tailscaled.service

  # Copies files/plymouth/* into / (see layout below)
  - type: files
    files:
      - source: plymouth
        destination: /
      - source: gdm
        destination: /

  # compile the dconf database so GDM sees the new key
  - type: script
    snippets:
      - dconf update

  # Rebuild initramfs so Plymouth picks up the new watermark
  - type: initramfs
  - type: signing   # keep last: sets up image signature verification
