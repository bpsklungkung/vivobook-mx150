---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: vivobook-mx150
# description will be included in the image's metadata
description: This is my personal OS image.

base-image: ghcr.io/blue-build/base-images/fedora-silverblue-nvidia
image-version: latest   # or pin e.g. 43

modules:
  # Tailscale isn't in Fedora's repos, so add its repo and install it
  - type: dnf
    install:
      packages:
        - tailscale
        - chromium
        - fish
        - gh
        - tesseract
        - tesseract-langpack-ind
        - poppler-utils
        - freerdp        # provides /usr/bin/xfreerdp

  - type: systemd
    system:
      enabled:
        - tailscaled.service
      masked:
        # Refreshes the GNOME Software app catalog; held up graphical.target by ~14 s
        - fedora-atomic-desktop-appstream-cache-refresh.service

  # Copies files/<source>/* into / (plymouth logo, GDM login logo, dracut config)
  - type: files
    files:
      - source: plymouth
        destination: /
      - source: gdm
        destination: /
      - source: dracut
        destination: /

  - type: script
    snippets:
      # compile the dconf database so GDM sees the new key
      - dconf update
      # the base image force-loads nvidia/amdgpu into the initramfs (383 MB);
      # remove it so files/dracut/.../99-slim.conf is the only driver config
      - rm -f /usr/lib/dracut/dracut.conf.d/99-nvidia.conf

  # Rebuild initramfs: picks up the Plymouth watermark and the slim dracut config.
  # Must stay after the files and script modules above.
  - type: initramfs
  - type: signing   # keep last: sets up image signature verification
