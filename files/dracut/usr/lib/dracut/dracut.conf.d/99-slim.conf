# Slim initramfs for the ASUS VivoBook (Intel i915 iGPU + NVIDIA MX150).
# The panel and Plymouth use i915, so it stays in the initramfs. NVIDIA loads
# later from the root filesystem, as on a normal Fedora install.
force_drivers+=" i915 "
omit_drivers+=" nvidia nvidia_drm nvidia_modeset nvidia_uvm nvidia_peermem amdgpu radeon nouveau "
omit_dracutmodules+=" nfs iscsi fcoe fcoe-uefi nbd cifs multipath dmraid "
